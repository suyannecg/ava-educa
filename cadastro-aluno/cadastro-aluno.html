<!DOCTYPE html>
<html lang="pt-br">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>AVA-EDUCA+</title>
 <link rel="stylesheet" href="./cadastro-aluno.css">
</head>

<body>

 <header>
  <h1 id="titulo-pagina">AVA-EDUCA+</h1>
  <h4 id="nome-usuario"></h4>
 </header>

 <nav>
  <button id="tela-inicio">Dashboard</button>
  <button disabled>Cursos</button>
  <button id="cadastrar-aluno">Cadastro de Alunos</button>
  <button id="sair-login">Sair</button>
 </nav>

 <main>
  <form id="formulario-aluno">

   <label for="nome-completo">Nome Completo:</label>
   <input type="text" name="nomeCompleto" id="nome-completo" required minlength="4" maxlength="80">

   <label for="genero">Gênero</label>
   <select name="genero" id="genero" required>
    <option value="">Selecione</option>
    <option value="Feminino">Feminino</option>
    <option value="Masculino">Masculino</option>
    <option value="Outro">Outro</option>
    <option value="Prefiro não informar">Prefiro não informar</option>
   </select>

   <label for="data-nasc">Data de Nascimento:</label>
   <input type="text" name="dataNasc" id="data-nasc" placeholder="DD/MM/YYYY" required>
   
   <label for="cpf">CPF:</label>
   <input type="text" name="cpf" id="cpf" required>

   <label for="telefone">Telefone:</label>
   <input type="text" name="telefone" id="telefone" required>

   <label for="email">E-mail</label>
   <input type="email" name="email" id="email" required>

   <label for="cep">CEP:</label>
   <input type="text" name="cep" id="cep">

   <label for="cidade">Cidade:</label>
   <input type="text" name="cidade" id="cidade">

   <label for="estado">Estado:</label>
   <input type="text" name="estado" id="estado">

   <label for="logradouro">Logradouro:</label>
   <input type="text" name="logradouro" id="logradouro">

   <label for="numero">Número:</label>
   <input type="text" name="numero" id="numero">

   <label for="complemento">Complemento:</label>
   <input type="text" name="complemento" id="complemento">

   <label for="bairro">Bairro:</label>
   <input type="text" name="bairro" id="bairro">

   <button type="submit">Salvar</button>
  </form>
 </main>

 <script type="module" src="./cadastro-aluno.js"></script>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
</body>
</html>
